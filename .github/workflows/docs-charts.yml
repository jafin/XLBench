name: docs charts

# Rebuilds the self-contained docs/charts.html (the interactive charts page) whenever a maintainer commits
# fresh benchmark data or changes the page's source. No benchmarks run here: this bakes the already-committed
# numbers from docs/results-data.js into the page (tools/charts-app), so it is fast and deterministic.
on:
  push:
    branches: [ main ]
    paths:
      - 'docs/results-data.js'
      - 'tools/charts-app/**'
  workflow_dispatch:

# Needed so the job can commit the regenerated page back to main.
permissions:
  contents: write

# Never run two regenerations against main at once.
concurrency:
  group: docs-charts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/charts-app
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from "packageManager" in tools/charts-app/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: tools/charts-app/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: tools/charts-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Type-checks, then builds docs/charts.html from docs/results-data.js.
      - name: Build docs/charts.html
        run: pnpm build

      - name: Commit regenerated page
        working-directory: .
        run: |
          if git diff --quiet -- docs/charts.html; then
            echo "charts.html unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/charts.html
          # [skip ci] keeps this commit from re-triggering build.yml; the path filter above
          # already keeps it from re-triggering this workflow.
          git commit -m "docs: regenerate charts.html from results-data.js [skip ci]"
          git push
