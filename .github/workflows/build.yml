name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # XLibur's SkiaSharp font engine needs fontconfig at runtime on Linux.
      - name: Install native deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: Build (Release)
        run: dotnet build src/XLBench/XLBench.csproj -c Release

      # IronXL has its own project (its dependencies cannot restore alongside ClosedXML's).
      # It needs a licence key to run, so CI only proves it still compiles.
      - name: Build IronXL project (Release)
        run: dotnet build src/XLBench.IronXL/XLBench.IronXL.csproj -c Release

      # Validation only: a Dry run proves every benchmark still compiles and executes.
      # It produces no trustworthy numbers (published results come from local runs).
      - name: Smoke-run write benchmarks (Dry)
        run: dotnet run -c Release --project src/XLBench --no-build -- --filter '*Write*' --job Dry

  # The interactive charts page (tools/charts-app). docs-charts.yml builds and commits it after a merge;
  # this job makes sure a change to the page, or to results-data.js, still type-checks and builds first.
  charts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/charts-app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: tools/charts-app/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: tools/charts-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the page
        run: pnpm build

      # The build writes into docs/, which holds the whole site, so check it touched only charts.html.
      - name: Check the build only wrote docs/charts.html
        working-directory: .
        run: |
          other=$(git status --porcelain --untracked-files=all -- docs | grep -v ' docs/charts.html$' || true)
          if [ -n "$other" ]; then
            echo "The charts build changed files other than docs/charts.html:"
            echo "$other"
            exit 1
          fi
